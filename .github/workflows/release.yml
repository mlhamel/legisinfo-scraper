name: CI & Publish

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Run tests
        run: uv run --extra dev pytest

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write # required for trusted publishing to PyPI
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Generate version with timestamp
        id: version_gen
        run: |
          TIMESTAMP=$(date -u +"%Y%m%d%H%M")
          VERSION="0.1.0.$TIMESTAMP"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Update pyproject.toml version
          sed -i 's/^version = ".*"/version = "'"$VERSION"'"/' pyproject.toml
          
          # Verify modification
          grep "^version" pyproject.toml

      - name: Build package
        run: uv build

      - name: Create and Push Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version_gen.outputs.version }}"
          git push origin "v${{ steps.version_gen.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version_gen.outputs.version }}"
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish package distributions to PyPI
        uses: pypa/github-action-pypi-publish@release/v1

