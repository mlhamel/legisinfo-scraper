[project]
name = "legisinfo-scraper"
version = "0.3.0"
description = "Scraper for Canadian parliamentary bill data, committing updates to a Git repository."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Mathieu Leduc-Hamel", email = "marrakis@gmail.com" }
]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0",
    "ftfy>=6.0.0",
    "civican-schemas>=0.2.0",
]

[tool.uv.sources]
civican-schemas = { path = "../civican-schemas", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "pre-commit>=3.5.0",
]

[project.urls]
Homepage = "https://github.com/mlhamel/legisinfo-scraper"
Repository = "https://github.com/mlhamel/legisinfo-scraper"
Issues = "https://github.com/mlhamel/legisinfo-scraper/issues"

[project.scripts]
legisinfo-scraper = "legisinfo_scraper.cli:main"
legisinfo-fix-encoding = "legisinfo_scraper.cli:fix_encoding_main"

[tool.hatch.build.targets.wheel]
packages = ["src/legisinfo_scraper"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "C90", # mccabe complexity
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "T10", # flake8-debugger
    "T20", # flake8-print
    "ARG", # flake8-unused-arguments
    "PT",  # flake8-pytest-style
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
]

[tool.mypy]
files = ["src"]
python_version = "3.10"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
