[project]
name = "legisinfo-scraper"
version = "0.1.0"
description = "Scraper for Canadian parliamentary bill data, committing updates to a Git repository."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["scraper.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
